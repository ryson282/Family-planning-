name: Contrôle des données

# Vérifie les fichiers de données et la logique du site à chaque pull request et à chaque modification de main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-data.mjs
      - name: Flux iCal (génération à blanc, sans réseau)
        env:
          FEED_TOKEN: ci-check-0123456789
          SYNC_URL: http://127.0.0.1:9
          SYNC_KEY: x
        run: node scripts/build-feed.mjs "$RUNNER_TEMP/feed"
