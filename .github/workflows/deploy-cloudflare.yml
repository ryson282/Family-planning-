name: Publier sur Cloudflare

# Publie le site (pages + assets + data) sur Cloudflare Pages à chaque fusion dans main et après chaque synchronisation
# des agendas ou des congés (leurs commits, faits avec le jeton GitHub par défaut, ne déclenchent pas « push »).
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) : CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID.
# Variable optionnelle CF_PAGES_PROJECT : nom du projet Pages (défaut : family-planning-ryson282).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Synchroniser les agendas", "Congés scolaires"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'family-planning-ryson282' }}
    steps:
      - name: Vérifier les secrets Cloudflare
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents : publication ignorée."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 20
      - name: Préparer le site
        if: steps.cfg.outputs.ready == 'true'
        run: |
          mkdir dist
          cp index.html taches.html semaine.html manifest.webmanifest dist/
          cp -r assets data dist/
      - name: Créer le projet Pages (ignoré s'il existe)
        if: steps.cfg.outputs.ready == 'true'
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || true
      - name: Publier
        if: steps.cfg.outputs.ready == 'true'
        run: npx --yes wrangler@3 pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true
