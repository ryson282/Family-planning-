name: Publier sur Cloudflare

# Publie le site (pages + assets + data) sur Cloudflare Pages : à chaque fusion dans main, à la demande, et quand une synchronisation
# des agendas ou des congés a modifié quelque chose (elles relancent ce workflow elles-mêmes : leurs commits, faits avec le jeton GitHub
# par défaut, ne déclenchent pas « push »). Les données sont contrôlées avant publication : une erreur bloque la publication.
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) : CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID ;
# facultatif : FEED_TOKEN (au moins 16 caractères, lettres/chiffres/-/_) pour publier le flux iCal des rappels à /ics/<jeton>/famille.ics.
# Variable optionnelle CF_PAGES_PROJECT : nom du projet Pages (défaut : family-planning-ryson282).
on:
  push:
    branches: [main]
  schedule:
    - cron: "20 4 * * *" # deux publications par jour : le flux iCal (tâches en retard, alertes de garde) est recalculé le matin
    - cron: "20 17 * * *" # et en fin d'après-midi (tâches ajoutées ou terminées dans la journée, rappels de la veille)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'family-planning-ryson282' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Contrôler les données
        run: node scripts/check-data.mjs
      - name: Vérifier les secrets Cloudflare
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents : le site n'est PAS publié."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Préparer le site
        if: steps.cfg.outputs.ready == 'true'
        run: |
          mkdir dist
          cp index.html taches.html semaine.html vacances.html manifest.webmanifest dist/
          cp -r assets data dist/
      - name: Flux iCal des rappels (si le secret FEED_TOKEN existe)
        if: steps.cfg.outputs.ready == 'true'
        continue-on-error: true # base illisible : on ne publie pas un flux sans les tâches (l'ancien flux reste dans Google Agenda), mais le site est quand même publié
        env:
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: node scripts/build-feed.mjs dist
      - name: Créer le projet Pages (ignoré s'il existe déjà)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          out=$(npx --yes wrangler@3.114.17 pages project create "$PROJECT" --production-branch=main 2>&1) || {
            echo "$out"
            echo "$out" | grep -qi "already exists" || exit 1
          }
      - name: Publier
        if: steps.cfg.outputs.ready == 'true'
        run: npx --yes wrangler@3.114.17 pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true
