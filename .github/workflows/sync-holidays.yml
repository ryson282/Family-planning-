name: Congés scolaires

on:
  schedule:
    - cron: "41 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  holidays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les congés scolaires FWB
        run: node scripts/fetch-holidays.mjs
      - name: Enregistrer si modifié
        run: |
          git config user.name "holidays-sync"
          git config user.email "holidays-sync@users.noreply.github.com"
          git add data/school-holidays-auto.js
          git diff --cached --quiet || (git commit -m "Mise à jour des congés scolaires" && git push)
