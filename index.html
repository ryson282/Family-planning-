<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning familial</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header><h1>Planning familial</h1></header>
<main>
  <section class="card">
    <div class="bar">
      <button id="prev">←</button><h2 id="title"></h2><select id="who" title="Voir les événements de"><option value="">Tout le monde</option></select><button id="today">Aujourd'hui</button><button id="next">→</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend" style="margin-top:10px">
      <span><i style="background:var(--vac)"></i>Vacances scolaires</span>
      <span><i style="background:var(--ferie)"></i>Jour férié</span>
      <span><i style="background:#4f9dff"></i>Enfants chez moi</span><span><i style="background:#b8bfcc"></i>Chez l'autre parent</span><span><i style="background:linear-gradient(90deg,#4f9dff,#b8bfcc)"></i>Échange</span><span>🐱 Maison vide</span><span>🧒 Garde de A² en congé</span>
      <span id="upd"></span>
    </div>
  </section>
  <section class="card">
    <h2 style="margin-top:0;font-size:1.1rem">À venir (30 jours)</h2>
    <ul class="list" id="upcoming"></ul>
  </section>
</main>
<script src="data/school-holidays.js"></script>
<script src="data/people.js"></script>
<script src="data/custody.js"></script>
<script src="data/school-events.js"></script>
<script src="data/absences.js"></script>
<script src="data/childcare.js"></script>
<script src="data/calendar.js"></script>
<script src="assets/common.js"></script>
<script>
nav("p");
let cur = new Date(); cur.setDate(1);
const events = allEvents();
const careByDay = Object.fromEntries(childcareDays().map(d => [d.date, d]));
const whoSel = document.getElementById("who");
whoSel.insertAdjacentHTML("beforeend", PEOPLE.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join(""));
whoSel.onchange = () => { render(); upcoming(); };
document.getElementById("upd").insertAdjacentHTML("beforebegin", PEOPLE.map(p => `<span><i style="background:${p.color}"></i>${esc(p.name.replace(/ \(.*\)/, ""))}</span>`).join(""));
const visible = e => !whoSel.value || !e.person || e.person === whoSel.value;

function render() {
  document.getElementById("title").textContent = cur.toLocaleDateString("fr-BE", { month: "long", year: "numeric" });
  const g = document.getElementById("grid");
  g.innerHTML = ["lun", "mar", "mer", "jeu", "ven", "sam", "dim"].map(d => `<div class="dow">${d}</div>`).join("");
  const first = new Date(cur);
  const offset = (first.getDay() + 6) % 7;
  const start = new Date(first); start.setDate(1 - offset);
  const todayIso = iso(new Date());
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = iso(d), h = holidayOn(k), c = custodyOn(k);
    const cls = ["day", d.getMonth() !== cur.getMonth() && "other", k === todayIso && "today",
      h && (h.type === "ferie" ? "ferie" : h.type === "vacances" ? "vac" : ""), c && "garde-" + c].filter(Boolean).join(" ");
    const evs = events.filter(e => visible(e) && inRange(k, e.date, e.end)).slice(0, 4)
      .map(e => `<span class="ev" style="border-color:${personColor(e.person)}" title="${esc(e.title)}">${esc((e.time ? e.time + " " : "") + e.title)}</span>`).join("");
    g.insertAdjacentHTML("beforeend", `<div class="${cls}"><span class="n">${d.getDate()}</span>${careByDay[k] ? `<span class="ev" style="border-color:${personColor("alixia")}" title="Garde de A² pendant le congé">🧒 ${esc(careByDay[k].solution || "garde à organiser")}</span>` : ""}${houseEmptyOn(k) ? `<span class="ev" style="border-color:${personColor("lana")}" title="Maison vide">🐱 ${esc(houseEmptyOn(k).sitter || "à organiser")}</span>` : ""}${h && h.type !== "vacances" ? `<span class="ev">${esc(h.name)}</span>` : ""}${evs}</div>`);
  }
  document.getElementById("upd").textContent = window.CALENDAR_UPDATED ? "Agendas synchronisés le " + new Date(window.CALENDAR_UPDATED).toLocaleString("fr-BE") : "Agendas Google non synchronisés";
}

function upcoming() {
  const today = iso(new Date()), limit = iso(new Date(Date.now() + 30 * MS));
  const rows = [
    ...events.filter(e => visible(e) && e.end >= today && e.date <= limit).map(e => ({ date: e.date, text: e.title, tag: e.source })),
    ...custodyPeriods().filter(p => p.end >= today && p.start <= limit).map(p => ({ date: p.start < today ? today : p.start, text: (p.who === "moi" ? "Enfants chez moi" : "Enfants chez l'autre parent") + " jusqu'au " + fmt(parse(p.end)), tag: "Garde" })),
    ...childcareGaps().filter(g => g.end >= today && g.start <= limit).map(g => ({ date: g.start, text: "Garde de A² à organiser (" + g.holiday.replace(/ \(.*\)/, "") + ") jusqu'au " + fmt(parse(g.end)), tag: "Garde" })),
    ...(window.HOUSE_EMPTY || []).filter(a => a.end >= today && a.start <= limit).map(a => ({ date: a.start, text: "Maison vide : Lana " + (a.sitter ? "gardée par " + a.sitter : "sans solution de garde") + " (" + (a.note || "") + ")", tag: "Lana" })),
    ...(window.SCHOOL_HOLIDAYS || []).filter(h => h.end >= today && h.start <= limit).map(h => ({ date: h.start, text: h.name, tag: "École" }))
  ].sort((a, b) => a.date.localeCompare(b.date));
  document.getElementById("upcoming").innerHTML = rows.length
    ? rows.map(r => `<li><span class="muted" style="min-width:90px">${fmt(parse(r.date))}</span><span class="t">${esc(r.text)}</span><span class="tag">${esc(r.tag)}</span></li>`).join("")
    : `<li class="muted">Rien de prévu.</li>`;
}

document.getElementById("prev").onclick = () => { cur.setMonth(cur.getMonth() - 1); render(); };
document.getElementById("next").onclick = () => { cur.setMonth(cur.getMonth() + 1); render(); };
document.getElementById("today").onclick = () => { cur = new Date(); cur.setDate(1); render(); };
render(); upcoming();
</script>
</body>
</html>
